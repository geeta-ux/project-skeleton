# version: "3.8"

services:
  # === MinIO for Milvus object storage ===
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    command: server /data
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # === Milvus Vector Database ===
  milvus:
    image: milvusdb/milvus:v2.4.3
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    environment:
      TZ: Asia/Kolkata
      MINIO_USE_EMBED: "false"
      MINIO_ADDRESS: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      ETCD_USE_EMBED: "true"
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - ./milvus_data:/var/lib/milvus
    restart: always

  # === PostgreSQL Database ===
  postgres:
    image: postgres:15
    container_name: pg-career-ai
    environment:
      POSTGRES_USER: career_user
      POSTGRES_PASSWORD: career_pass
      POSTGRES_DB: career_guide_ai
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    restart: always

volumes:
  milvus_data:
  pg_data:
  minio_data:
