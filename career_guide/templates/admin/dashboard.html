{% extends "base.html" %}
{% block content %}
<h1>Admin Dashboard</h1>

<h2>Careers</h2>
<a href="{{ url_for('admin.add_career') }}">Add Career</a>
<ul>
  {% for c in careers %}
  <li>{{ c.title }} - <a href="{{ url_for('admin.delete_career', id=c.id) }}">Delete</a></li>
  {% endfor %}
</ul>

<h2>Questions</h2>
<a href="{{ url_for('admin.add_question') }}">Add Question</a>
<ul>
  {% for q in questions %}
  <li>{{ q.text }} - <a href="{{ url_for('admin.delete_question', id=q.id) }}">Delete</a></li>
  {% endfor %}
</ul>
{% endblock %}
